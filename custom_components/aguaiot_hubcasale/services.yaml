sync_clock:
  target:
    entity:
      domain: climate

set_chrono_program:
  target:
    entity:
      domain: climate
  fields:
    program:
      required: true
      default: 1
      selector:
        number:
          min: 1
          max: 4
          mode: box
    start:
      selector:
        time:
    stop:
      selector:
        time:
    days:
      selector:
        select:
          multiple: true
          mode: list
          translation_key: chrono_days
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    water_temperature:
      selector:
        number:
          min: 40
          max: 90
          unit_of_measurement: "°C"
          mode: box
    boiler_temperature:
      selector:
        number:
          min: 30
          max: 90
          unit_of_measurement: "°C"
          mode: box
    acs:
      selector:
        boolean:
    weekly_enabled:
      selector:
        boolean:

read_offsets:
  fields:
    start:
      default: 33100
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    stop:
      default: 33300
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    step:
      default: 2
      selector:
        number:
          min: 1
          max: 64
          mode: box
    word:
      default: true
      selector:
        boolean:
    label:
      default: probe
      selector:
        text:
